name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 4 * * *" # At 12PM UTC+8
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      # Step 1: run a standard checkout action
      - name: Checkout target repo
        uses: actions/checkout@v4

      # Step 2: run the sync action
      # Merge strategy (default): your own commits on the fork are preserved.
      # If the pull conflicts, the job fails and you resolve it manually.
      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          upstream_sync_repo: JiuNian090/LeLeTV
          upstream_sync_branch: main
          target_sync_branch: main
          # GITHUB_TOKEN works for ordinary code changes but cannot push
          # .github/workflows/**. If you have set a PAT with the `workflow`
          # scope as the UPSTREAM_SYNC_TOKEN secret, it is used instead.
          target_repo_token: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] Automatic sync failed. Two common causes:"
          echo "  1. Your fork has commits that conflict with upstream - resolve them and sync manually."
          echo "  2. The upstream change touches .github/workflows/**, which GITHUB_TOKEN cannot push."
          echo "     Add a PAT with the 'workflow' scope as the UPSTREAM_SYNC_TOKEN secret, or sync manually via the 'Sync fork' button."
          exit 1
