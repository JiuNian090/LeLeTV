<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LeLeTV · 播放</title>
    <meta name="theme-color" content="#0A0A0B">
    <meta name="description" content="LeLeTV 视频播放器">
    <!-- iOS PWA：独立窗口 + 状态栏透明，背景可延伸至刘海后方 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Favicon -->
    <link rel="icon" href="/image/brand/leletv-favicon.svg?v=le4" type="image/svg+xml">
    <link rel="icon" href="/image/brand/favicon-32.png?v=le4" sizes="32x32">
    <link rel="apple-touch-icon" href="/image/brand/apple-touch-icon-180.png?v=le4">
    <link rel="manifest" href="/manifest.json">
    
    <!-- 样式：变量与背景 → 通用组件 → 播放页 -->
    <link rel="stylesheet" href="css/v2/tokens.css?v=v4.0.4">
    <link rel="stylesheet" href="css/v2/base.css?v=v4.0.4">
    <link rel="stylesheet" href="css/v2/player.css?v=v4.0.4">
    
    <meta http-equiv="Cache-Control" content="no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

<!-- 主题：私密模式标记 + 已保存的主题色，均在首帧之前落到 <html> 上
     · 私密模式：css/variables.css 的 html[data-hidden-mode] 据此把默认色切成铜色
     · 自定义主题色：把派生色写进行内样式（优先级高于上面的样式表规则），
       避免先闪默认色再切到目标色；算法与 js/ui/theme-system.js 一致，改动需同步 -->
<script>
    (function () {
        var d = document.documentElement;
        try {
            if (localStorage.getItem('hiddenContentMode') === 'true') {
                d.setAttribute('data-hidden-mode', '1');
            }
        } catch (e) { /* localStorage 不可用时按正常模式渲染 */ }
        try {
            // 动态效果偏好：设置里强制开启 / 关闭时打到 <html> 上，css 与脚本据此放行或停掉动画
            // 地址带 ?motion=on / off / auto 时先按它记下来（排查时一次性强制开启用）
            var motionParam = new URLSearchParams(location.search).get('motion');
            if (motionParam === 'on' || motionParam === 'off') localStorage.setItem('leletv_motion', motionParam);
            else if (motionParam === 'auto') localStorage.removeItem('leletv_motion');
            var motion = localStorage.getItem('leletv_motion');
            if (motion === 'on' || motion === 'off') d.setAttribute('data-motion', motion);
        } catch (e) { /* 忽略 */ }

        try {
            // 按数据域取已保存的主题（两个模式各存一套；没存过就保持 css 默认色）
            var raw = localStorage.getItem(d.hasAttribute('data-hidden-mode') ? 'leletv_theme_hidden' : 'leletv_theme_normal');
            if (!raw) return;
            var m = /^#?([0-9a-f]{6})$/i.exec(String((JSON.parse(raw) || {}).hex || ''));
            if (!m) return;
            var hx = m[1];
            var R = parseInt(hx.slice(0, 2), 16) / 255;
            var G = parseInt(hx.slice(2, 4), 16) / 255;
            var B = parseInt(hx.slice(4, 6), 16) / 255;
            var mx = Math.max(R, G, B), mn = Math.min(R, G, B), L = (mx + mn) / 2, D = mx - mn;
            var H = 0, S = 0;
            if (D > 1e-6) {
                S = L > 0.5 ? D / (2 - mx - mn) : D / (mx + mn);
                H = mx === R ? 60 * (((G - B) / D) % 6) : (mx === G ? 60 * ((B - R) / D + 2) : 60 * ((R - G) / D + 4));
                if (H < 0) H += 360;
            }
            S *= 100;
            var STOPS = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900];
            var LS = [96, 93, 87, 80, 70, 60, 51, 43, 35, 26];
            // 无彩色（灰色系）另铺满黑→白，与 js/ui/theme-system.js 的 RAMP_L_MONO 一致
            if (S < 5) LS = [100, 89, 78, 67, 56, 44, 33, 22, 11, 0];
            // 只调明度、保留色相与饱和度：无彩色主色自然得到灰阶
            function shade(l) {
                var c = (1 - Math.abs(2 * l / 100 - 1)) * (S / 100);
                var x = c * (1 - Math.abs(((H / 60) % 2) - 1));
                var mm = l / 100 - c / 2, r = 0, g = 0, b = 0;
                if (H < 60) { r = c; g = x; } else if (H < 120) { r = x; g = c; }
                else if (H < 180) { g = c; b = x; } else if (H < 240) { g = x; b = c; }
                else if (H < 300) { r = x; b = c; } else { r = c; b = x; }
                function f(v) { return ('0' + Math.round((v + mm) * 255).toString(16)).slice(-2); }
                return {
                    hex: '#' + f(r) + f(g) + f(b),
                    rgb: [Math.round((r + mm) * 255), Math.round((g + mm) * 255), Math.round((b + mm) * 255)]
                };
            }
            var st = d.style;
            st.setProperty('--color-primary', '#' + hx);
            st.setProperty('--color-primary-rgb', Math.round(R * 255) + ', ' + Math.round(G * 255) + ', ' + Math.round(B * 255));
            var c3 = shade(80), c4 = shade(70), c6 = shade(51);
            st.setProperty('--color-primary-300', c3.hex);
            st.setProperty('--color-primary-400', c4.hex);
            st.setProperty('--color-primary-400-rgb', c4.rgb.join(', '));
            st.setProperty('--color-primary-600', c6.hex);
            st.setProperty('--color-primary-600-rgb', c6.rgb.join(', '));
            for (var i = 0; i < STOPS.length; i++) {
                st.setProperty('--tw-pink-' + STOPS[i] + '-rgb', shade(LS[i]).rgb.join(' '));
            }
            // 配色派生的其余变量（辅助色、字标色、logo 底色、按钮文字色）由 theme-system.js 算好存在存档里，
            // 这里按名单回放；名单与 theme-system.js 的 EXTRA_VARS 一致
            var vars = (JSON.parse(raw) || {}).vars;
            var ALLOW = ['--v2-blush', '--v2-word', '--v2-aux', '--v2-aux-rgb', '--v2-glow-2', '--v2-tile', '--v2-on-accent', '--v2-bg'];
            if (vars && typeof vars === 'object') {
                for (var j = 0; j < ALLOW.length; j++) {
                    var val = vars[ALLOW[j]];
                    if (typeof val === 'string' && val.length < 64 && /^[#\w(),.\s%-]+$/.test(val)) st.setProperty(ALLOW[j], val);
                }
            }
        } catch (e) { /* 读取失败时回落到 css 默认主题色 */ }
    })();
</script>
</head>
<body class="player-page">
    <!-- 全站背景：三团缓慢漂移的径向光，参数见 css/v2/tokens.css -->
    <div class="v2-glow" aria-hidden="true"><span class="g-main"></span><span class="g-blush"></span><span class="g-deep"></span></div>
    
    <main class="player-main">
        <div class="player-layout">
            <!-- 左栏：播放器 -->
            <div class="player-layout-left">
                <div id="playerContainer" class="player-container">
                    <button type="button" data-action="go-home" class="player-back-btn" aria-label="返回">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg>
                    </button>

                    <div class="player-stage">
                        <div id="player" class="player-placeholder"></div>

                        <div class="error-container" id="error">
                            <div class="error-icon">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 8v4.5m0 3.5h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>
                            </div>
                            <div id="error-message">视频加载失败</div>
                            <div class="error-message-sub">可以在「线路切换」中换一个片源，或稍后重试。</div>
                            <button type="button" id="error-back-btn" class="error-back-btn" style="display:none;margin-top:12px">返回上一页</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右栏：标题与详情 → 选集 → 线路切换 → 操作 -->
            <div class="player-layout-right">
                <section class="player-panel player-detail-info" id="playerDetailInfo">
                    <div class="detail-title-row">
                        <h1 class="player-right-title" id="videoTitleRight">正在加载</h1>
                        <div class="detail-toggle-header" data-action="toggle-detail" role="button" tabindex="0" aria-label="展开或收起详情">
                            <span class="detail-desc-label">详情</span>
                            <svg class="detail-toggle-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                        </div>
                    </div>
                    <div class="detail-meta-container" id="detailMetaContainer"></div>
                    <div class="detail-desc-section" id="detailDescSection">
                        <div class="detail-collapse-body" id="detailDescBody"></div>
                    </div>
                </section>

                <section class="player-panel player-container player-right-item episode-section" id="episodeSection">
                    <div class="detail-toggle-header" data-action="toggle-episodes">
                        <div class="episode-title-group">
                            <h2 class="episode-section-title">选集</h2>
                            <button type="button" data-action="toggle-episode-order" class="episode-order-btn" aria-label="切换选集排序">
                                <svg id="orderIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <line x1="3" y1="6" x2="21" y2="6"/><polyline points="17 2 21 6 17 10"/>
                                    <line x1="21" y1="18" x2="3" y2="18"/><polyline points="7 14 3 18 7 22"/>
                                </svg>
                            </button>
                        </div>
                        <div class="episode-header-right">
                            <svg class="detail-toggle-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                        </div>
                    </div>
                    <div class="episode-collapse-body">
                        <div class="episode-grid" id="episodesGrid">
                            <div id="episodesList">
                                <div class="episode-empty">正在加载选集</div>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="player-panel player-container player-right-item resource-collapse collapsed" id="resourceSection">
                    <div class="detail-toggle-header resource-collapse-header" data-action="toggle-resource-list">
                        <div class="resource-collapse-title-group">
                            <h2 class="resource-collapse-title">线路切换</h2>
                            <span class="resource-collapse-source" id="resourceCurrentSource"></span>
                            <span class="resource-collapse-count" id="resourceSourceCount">· 当前集共 - 个来源</span>
                        </div>
                        <svg class="detail-toggle-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                    </div>
                    <div class="resource-collapse-body">
                        <div class="resource-source-grid" id="resourceSourceGrid">
                            <div class="resource-source-hint">展开后开始检测全部线路</div>
                        </div>
                    </div>
                </section>

                <section class="player-panel player-container player-right-item">
                    <div class="player-actions control-buttons-container">
                        <label class="player-action autoplay-container control-btn" for="autoplayToggle">
                            <span>自动连播</span>
                            <span class="switch">
                                <input type="checkbox" id="autoplayToggle">
                                <span class="slider"></span>
                            </span>
                        </label>
                        <button type="button" data-action="copy-links" class="player-action control-btn">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 15 15 9m-4-3.5 1.2-1.2a4 4 0 0 1 5.66 5.66L16.6 11.2M7.4 12.8l-1.26 1.26a4 4 0 0 0 5.66 5.66L13 18.5"/></svg>
                            <span>复制链接</span>
                        </button>
                        <button type="button" id="lightsToggle" class="player-action control-btn" aria-pressed="false" title="关灯：整页压黑，只留播放器；点黑色区域或按 Esc 开灯">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 18h5M10.5 21h3M12 3a6 6 0 0 0-3.4 10.9c.7.5 1.1 1.3 1.2 2.1h4.4c.1-.8.5-1.6 1.2-2.1A6 6 0 0 0 12 3Z"/></svg>
                            <span>关灯</span>
                        </button>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <!-- 关灯遮罩：压黑整页，只留播放器 -->
    <div id="lightsOverlay" class="lights-overlay" aria-hidden="true"></div>

    <!-- 添加快捷键提示元素 -->
    <div class="shortcut-hint" id="shortcutHint">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" id="shortcutIcon" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        <span id="shortcutText"></span>
    </div>

    <!-- 提示条 -->
    <div id="toast" class="v2-toast" role="status" aria-live="polite">
        <span class="v2-toast-dot" aria-hidden="true"></span>
        <p id="toastMessage"></p>
    </div>

    <!-- 加载层 -->
    <div id="loading" class="v2-overlay hidden" role="status" aria-live="polite">
        <div class="v2-loading-card">
            <span class="v2-spinner" aria-hidden="true"></span>
            <p>正在加载</p>
        </div>
    </div>

    <!-- 引入纯 JS sha256（HTTP 下依然可用） -->
    <script src="libs/sha256.min.js?v=v4.0.4"></script>
    <script>
        // 保存原始 js‑sha256 实现，避免被 password.js 覆盖
        window._jsSha256 = window.sha256;
    </script>

    <!-- 邀请码验证检查：未登录直接跳回首页。
         本地版（服务端没有配置 Worker 地址，占位符被替换成空串）没有邀请码后端，看首页的本地放行记录 -->
    <script>
        (function() {
            const workerUrl = "{{TMDB_WORKER_URL}}";
            const inviteAuth = localStorage.getItem('leletv_invite_auth');
            const isAdmin = localStorage.getItem('leletv_is_admin') === 'true';
            const localPassed = !workerUrl && localStorage.getItem('leletv_local_invite_passed') === '1';
            if (!inviteAuth && !isAdmin && !localPassed) {
                window.location.replace('/');
            }
        })();
    </script>
    
    <script src="libs/hls.min.js?v=v4.0.4" defer crossorigin="anonymous"></script>
    <script src="libs/artplayer.min.js?v=v4.0.4" defer crossorigin="anonymous"></script>
    <script src="dist/leletv-core.miuqd5.js?v=v4.0.4" defer></script>
    <script src="dist/leletv-player.y1shlj.js?v=v4.0.4" defer></script>

    <script>
        // 创建全局环境变量对象
        window.__ENV__ = window.__ENV__ || {};
        
        // 注入服务器端环境变量 (将由服务器端替换)
        // HIDDENKEY 变量将在这里被服务器端注入
        window.__ENV__.HIDDENKEY = "{{HIDDENKEY}}";
        window.__ENV__.TMDB_WORKER_URL = "{{TMDB_WORKER_URL}}";
        window.__LELETV_VERSION__ = "v4.0.4";

        // 确保首页按钮功能正常
        function ensureGoHome() {
            if (typeof goHome !== 'function') {
                window.goHome = function(event) {
                    if (event) event.preventDefault();
                    try {
                        window.location.href = '/';
                    } catch (e) {
                        window.location.assign('/');
                    }
                };
            }
        }
        
        // 页面加载后立即执行
        ensureGoHome();
        
        // DOM加载完成后再次确保
        document.addEventListener('DOMContentLoaded', ensureGoHome);

    </script>
    <!-- 版本更新检测模块 -->
    <!-- 缓存管理模块 -->
    <script>
        // 初始化邮箱点击处理器
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof setupEmailClickHandlers === 'function') {
                setupEmailClickHandlers();
            }
        });
    </script>
</body>
</html>
