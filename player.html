<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频播放器</title>
    <meta name="description" content="LeLeTV 视频播放器">
    
    <!-- Favicon -->
    <link rel="icon" href="/image/logo.png">
    <link rel="apple-touch-icon" href="/image/logo-black.png">
    <link rel="manifest" href="/manifest.json">
    
    <link rel="stylesheet" href="css/variables.css?v=v3.6.1">
    <link rel="stylesheet" href="css/output.css?v=v3.6.1">
    <link rel="stylesheet" href="css/styles.css?v=v3.6.1">
    <link rel="stylesheet" href="css/player.css?v=v3.6.1">
    
    <meta http-equiv="Cache-Control" content="no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

<!-- 主题：私密模式标记 + 已保存的主题色，均在首帧之前落到 <html> 上
     · 私密模式：css/variables.css 的 html[data-hidden-mode] 据此把默认色切成铜色
     · 自定义主题色：把派生色写进行内样式（优先级高于上面的样式表规则），
       避免先闪默认色再切到目标色；算法与 js/ui/theme-system.js 一致，改动需同步 -->
<script>
    (function () {
        var d = document.documentElement;
        try {
            if (localStorage.getItem('hiddenContentMode') === 'true') {
                d.setAttribute('data-hidden-mode', '1');
            }
        } catch (e) { /* localStorage 不可用时按正常模式渲染 */ }

        try {
            // 按数据域取已保存的主题（两个模式各存一套；没存过就保持 css 默认色）
            var raw = localStorage.getItem(d.hasAttribute('data-hidden-mode') ? 'leletv_theme_hidden' : 'leletv_theme_normal');
            if (!raw) return;
            var m = /^#?([0-9a-f]{6})$/i.exec(String((JSON.parse(raw) || {}).hex || ''));
            if (!m) return;
            var hx = m[1];
            var R = parseInt(hx.slice(0, 2), 16) / 255;
            var G = parseInt(hx.slice(2, 4), 16) / 255;
            var B = parseInt(hx.slice(4, 6), 16) / 255;
            var mx = Math.max(R, G, B), mn = Math.min(R, G, B), L = (mx + mn) / 2, D = mx - mn;
            var H = 0, S = 0;
            if (D > 1e-6) {
                S = L > 0.5 ? D / (2 - mx - mn) : D / (mx + mn);
                H = mx === R ? 60 * (((G - B) / D) % 6) : (mx === G ? 60 * ((B - R) / D + 2) : 60 * ((R - G) / D + 4));
                if (H < 0) H += 360;
            }
            S *= 100;
            var STOPS = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900];
            var LS = [96, 93, 87, 80, 70, 60, 51, 43, 35, 26];
            // 无彩色（灰色系）另铺满黑→白，与 js/ui/theme-system.js 的 RAMP_L_MONO 一致
            if (S < 5) LS = [100, 89, 78, 67, 56, 44, 33, 22, 11, 0];
            // 只调明度、保留色相与饱和度：无彩色主色自然得到灰阶
            function shade(l) {
                var c = (1 - Math.abs(2 * l / 100 - 1)) * (S / 100);
                var x = c * (1 - Math.abs(((H / 60) % 2) - 1));
                var mm = l / 100 - c / 2, r = 0, g = 0, b = 0;
                if (H < 60) { r = c; g = x; } else if (H < 120) { r = x; g = c; }
                else if (H < 180) { g = c; b = x; } else if (H < 240) { g = x; b = c; }
                else if (H < 300) { r = x; b = c; } else { r = c; b = x; }
                function f(v) { return ('0' + Math.round((v + mm) * 255).toString(16)).slice(-2); }
                return {
                    hex: '#' + f(r) + f(g) + f(b),
                    rgb: [Math.round((r + mm) * 255), Math.round((g + mm) * 255), Math.round((b + mm) * 255)]
                };
            }
            var st = d.style;
            st.setProperty('--color-primary', '#' + hx);
            st.setProperty('--color-primary-rgb', Math.round(R * 255) + ', ' + Math.round(G * 255) + ', ' + Math.round(B * 255));
            var c3 = shade(80), c4 = shade(70), c6 = shade(51);
            st.setProperty('--color-primary-300', c3.hex);
            st.setProperty('--color-primary-400', c4.hex);
            st.setProperty('--color-primary-400-rgb', c4.rgb.join(', '));
            st.setProperty('--color-primary-600', c6.hex);
            st.setProperty('--color-primary-600-rgb', c6.rgb.join(', '));
            for (var i = 0; i < STOPS.length; i++) {
                st.setProperty('--tw-pink-' + STOPS[i] + '-rgb', shade(LS[i]).rgb.join(' '));
            }
        } catch (e) { /* 读取失败时回落到 css 默认主题色 */ }
    })();
</script>
</head>
<body>
    <!-- Aurora 极光背景 -->
    <div id="auroraContainer" class="aurora-bg"></div>
    
    <main class="container mx-auto px-4 py-4">
        <div class="player-layout">
            <!-- 左栏：视频播放区 -->
            <div class="player-layout-left">
                <div id="playerContainer" class="player-container">
                    <button data-action="go-home" class="player-back-btn" title="返回首页">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </button>

                    <div class="relative">
                        <div id="player" class="player-placeholder">
                        </div>
                        
                        <div class="error-container" id="error">
                            <div class="error-icon">
                            <svg class="w-12 h-12 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
                            </svg>
                        </div>
                            <div id="error-message">视频加载失败</div>
                            <div class="error-message-sub">请尝试其他视频源或稍后重试</div>
                            <button id="error-back-btn" class="error-back-btn" style="display:none;margin-top:16px">返回上一页</button>
                        </div>
                        
                    </div>
                </div>
            </div>

            <!-- 右栏：标题+详情 + 选集 + 资源信息 + 控制按钮 -->
            <div class="player-layout-right">
                <!-- 视频标题 + 详情（合并） -->
                <div class="player-detail-info" id="playerDetailInfo">
                    <div class="detail-title-row">
                        <h2 class="player-right-title" id="videoTitleRight">加载中...</h2>
                        <div class="detail-toggle-header" data-action="toggle-detail">
                            <span class="detail-desc-label">详情</span>
                            <svg class="detail-toggle-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </div>
                    </div>
                    <div class="detail-meta-container" id="detailMetaContainer"></div>
                    <div class="detail-desc-section" id="detailDescSection">
                        <div class="detail-collapse-body" id="detailDescBody"></div>
                    </div>
                </div>

                <!-- 选集区域（可折叠） -->
                <div class="player-container player-right-item episode-section" id="episodeSection">
                    <div class="detail-toggle-header" data-action="toggle-episodes">
                        <div class="episode-title-group">
                            <h3 class="episode-section-title">选集</h3>
                            <button data-action="toggle-episode-order" class="episode-order-btn" title="切换排序">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" id="orderIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="3" y1="6" x2="21" y2="6"/><polyline points="17 2 21 6 17 10"/>
                                    <line x1="21" y1="18" x2="3" y2="18"/><polyline points="7 14 3 18 7 22"/>
                                </svg>
                            </button>
                        </div>
                        <div class="episode-header-right">
                            <svg class="detail-toggle-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                            </svg>
                        </div>
                    </div>
                    <div class="episode-collapse-body">
                        <div class="episode-grid" id="episodesGrid">
                            <div class="grid gap-2" id="episodesList">
                                <!-- 集数将在这里动态加载 -->
                                <div class="col-span-full text-center text-gray-400 py-8">加载中...</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 线路切换（折叠面板，展开后扫描当前数据域的全部来源） -->
                <div class="player-container player-right-item resource-collapse collapsed" id="resourceSection">
                    <div class="detail-toggle-header resource-collapse-header" data-action="toggle-resource-list">
                        <div class="resource-collapse-title-group">
                            <h3 class="resource-collapse-title">线路切换</h3>
                            <span class="resource-collapse-count" id="resourceSourceCount">· 当前集共 - 个来源</span>
                        </div>
                        <svg class="detail-toggle-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </div>
                    <div class="resource-collapse-body">
                        <div class="resource-source-grid" id="resourceSourceGrid">
                            <div class="resource-source-hint">展开后开始扫描全部线路…</div>
                        </div>
                    </div>
                </div>

                <!-- 控制按钮 -->
                <div class="player-container player-right-item">
                    <div class="flex items-center justify-start gap-3 control-buttons-container">
                        <!-- 自动连播开关 -->
                        <div class="flex items-center gap-1 autoplay-container control-btn px-3 py-1 rounded-lg justify-center bg-[rgba(255,255,255,0.02)] border border-[#2a2a2a] hover:bg-[rgba(255,255,255,0.05)] transition">
                            <span class="text-gray-400 text-sm whitespace-nowrap">自动连播</span>
                            <label class="switch">
                                <input type="checkbox" id="autoplayToggle">
                                <span class="slider"></span>
                            </label>
                        </div>

                        <!-- 复制链接按钮 -->
                        <button data-action="copy-links" title="复制播放链接"
                                class="flex items-center gap-1.5 control-btn px-3 py-1 rounded-lg justify-center bg-[rgba(255,255,255,0.02)] border border-[#2a2a2a] hover:bg-[rgba(255,255,255,0.05)] transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 012-2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                            </svg>
                            <span class="text-gray-400 text-sm whitespace-nowrap">复制链接</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 添加快捷键提示元素 -->
    <div class="shortcut-hint" id="shortcutHint">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" id="shortcutIcon">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
        </svg>
        <span id="shortcutText"></span>
    </div>

    <!-- 统一的提示框 -->
    <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 text-white px-5 py-2.5 shadow-lg transform transition-all duration-300 opacity-0 scale-50 z-50 pointer-events-none">
        <p id="toastMessage"></p>
    </div>

    <!-- 添加 loading 提示框 -->
    <div id="loading" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-[10001]">
        <div class="bg-[#111] p-8 rounded-lg border border-[var(--color-border-default)] flex items-center space-x-4">
            <div class="w-8 h-8 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
            <p class="text-white text-lg">加载中...</p>
        </div>
    </div>

    <!-- 引入纯 JS sha256（HTTP 下依然可用） -->
    <script src="libs/sha256.min.js?v=v3.6.1"></script>
    <script>
        // 保存原始 js‑sha256 实现，避免被 password.js 覆盖
        window._jsSha256 = window.sha256;
    </script>

    <!-- 邀请码验证检查：未登录直接跳回首页 -->
    <script>
        (function() {
            const inviteAuth = localStorage.getItem('leletv_invite_auth');
            const isAdmin = localStorage.getItem('leletv_is_admin') === 'true';
            if (!inviteAuth && !isAdmin) {
                window.location.replace('/');
            }
        })();
    </script>
    
    <script src="libs/hls.min.js?v=v3.6.1" defer crossorigin="anonymous"></script>
    <script src="libs/artplayer.min.js?v=v3.6.1" defer crossorigin="anonymous"></script>
    <script src="dist/leletv-core.q6axkb.js?v=v3.6.1" defer></script>
    <script src="dist/leletv-player.8o8x66.js?v=v3.6.1" defer></script>

    <script>
        // 创建全局环境变量对象
        window.__ENV__ = window.__ENV__ || {};
        
        // 注入服务器端环境变量 (将由服务器端替换)
        // HIDDENKEY 变量将在这里被服务器端注入
        window.__ENV__.HIDDENKEY = "{{HIDDENKEY}}";
        window.__LELETV_VERSION__ = "v3.6.1";

        // 确保首页按钮功能正常
        function ensureGoHome() {
            if (typeof goHome !== 'function') {
                window.goHome = function(event) {
                    if (event) event.preventDefault();
                    try {
                        window.location.href = '/';
                    } catch (e) {
                        window.location.assign('/');
                    }
                };
            }
        }
        
        // 页面加载后立即执行
        ensureGoHome();
        
        // DOM加载完成后再次确保
        document.addEventListener('DOMContentLoaded', ensureGoHome);

    </script>
    <!-- 版本更新检测模块 -->
    <!-- 缓存管理模块 -->
    <script>
        // 初始化邮箱点击处理器
        document.addEventListener('DOMContentLoaded', function() {
            var auroraInstances = initAurora({
                selector: '#auroraContainer',
                colorStops: ['#3A29FF', (typeof themeColor === 'function' ? themeColor() : '#ec4899'), '#FFD700'],
                amplitude: 0.5,
                blend: 0.8,
                speed: 0.5
            });

            // 视频播放期间把 GPU 让给解码：极光冻结，暂停/播完再接着走。
            // video 的 play/pause 不冒泡，所以在捕获阶段监听
            function setAuroraPaused(paused) {
                (auroraInstances || []).forEach(function (inst) {
                    if (!inst) return;
                    if (paused) inst.pause();
                    else inst.resume();
                });
            }
            document.addEventListener('play', function () { setAuroraPaused(true); }, true);
            document.addEventListener('pause', function () { setAuroraPaused(false); }, true);
            document.addEventListener('ended', function () { setAuroraPaused(false); }, true);

            if (typeof setupEmailClickHandlers === 'function') {
                setupEmailClickHandlers();
            }
        });
    </script>
</body>
</html>
