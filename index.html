<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <!-- 首帧即黑：必须紧跟 charset，早于一切外部资源与脚本。
         PWA 从桌面/主屏图标冷启动时，浏览器在拉到样式表之前有一个"默认白底"窗口，
         这段内联样式让第一次绘制就是黑底，杜绝白屏闪烁。 -->
    <meta name="theme-color" content="#0A0A0B">
    <style>
        html, body { background: #0A0A0B !important; margin: 0; padding: 0; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <title>LeLeTV</title>
    <meta name="description" content="LeLeTV：多源影视检索与播放。">
    <meta name="keywords" content="在线视频,视频搜索,电影,电视剧,LeLeTV">
    <meta name="author" content="LeLeTV Team">

    <!-- Favicon -->
    <link rel="icon" href="/image/brand/leletv-favicon.svg?v=le6" type="image/svg+xml">
    <link rel="icon" href="/image/brand/favicon-32.png?v=le6" sizes="32x32">
    <link rel="apple-touch-icon" sizes="180x180" href="/image/brand/apple-touch-icon-180.png?v=le6">
    <link rel="manifest" href="/manifest.json">

    <!-- 提前握手海报图床；正文两种字重先取，首屏文字不等字体 -->
    <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/libs/geist/Geist-Regular.woff2?v=v3.4.0">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/libs/geist/Geist-Bold.woff2?v=v3.4.0">
    <!-- 播放页 bundle 的文件名（打包脚本会更新），结果页出来后用它预取播放页资源 -->
    <meta name="leletv-player-bundle" content="dist/leletv-player.x8twdd.js">
    <!-- 非首页页面的按需 bundle（构建脚本会更新文件名） -->
    <meta name="leletv-page-bundles" content='{"category":"dist/leletv-category.idfvkn.js","settings":"dist/leletv-settings.5i2r9b.js"}'>

    <!-- PWA：添加到主屏/桌面后以独立窗口运行（无浏览器 UI） -->
    <!-- mobile-web-app-capable 为标准化写法（Chrome 已废弃 apple-* 前缀）；apple-* 保留以兼容 iOS Safari -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- iOS 主屏启动帧：这里刻意不提供 apple-touch-startup-image。
         系统帧只使用 manifest 的 background_color（#0A0A0B），与站内 #bootSplash 首帧同色；
         网页一旦到达就直接接管成「玻璃五角星 → LeLeTV」入场，避免静态启动图与动画之间跳变。
         旧机型若回退为系统默认色，也只会与启动层基底相差一帧。 -->

    <!-- 样式：变量与背景 → 通用组件 → 首页。
         views.css（内页）与 admin.css（设置页面板）改由 js/app/page-loader.js
         在首次进入对应页面时加载，不再占用首屏。 -->
    <link rel="stylesheet" href="css/v2/tokens.css?v=v4.1.2">
    <link rel="stylesheet" href="css/v2/base.css?v=v4.1.2">
    <link rel="stylesheet" href="css/v2/home.css?v=v4.1.2">

    <!-- Geist 字体：本地自托管（原先走 cdn.jsdelivr.net，跨境抖动会拖慢首屏；libs/* 命中长缓存） -->
    <style>
        @font-face {
            font-family: 'Geist';
            src: url('/libs/geist/Geist-Regular.woff2?v=v3.4.0') format('woff2');
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: 'Geist';
            src: url('/libs/geist/Geist-Medium.woff2?v=v3.4.0') format('woff2');
            font-weight: 500;
            font-display: swap;
        }
        @font-face {
            font-family: 'Geist';
            src: url('/libs/geist/Geist-SemiBold.woff2?v=v3.4.0') format('woff2');
            font-weight: 600;
            font-display: swap;
        }
        @font-face {
            font-family: 'Geist';
            src: url('/libs/geist/Geist-Bold.woff2?v=v3.4.0') format('woff2');
            font-weight: 700;
            font-display: swap;
        }
    </style>

    <!-- 主题：私密模式标记 + 已保存的主题色，均在首帧之前落到 <html> 上
     · 私密模式：css/variables.css 的 html[data-hidden-mode] 据此把默认色切成铜色
     · 自定义主题色：把派生色写进行内样式（优先级高于上面的样式表规则），
       避免先闪默认色再切到目标色；算法与 js/ui/theme-system.js 一致，改动需同步 -->
<script>
    (function () {
        var d = document.documentElement;
        try {
            if (localStorage.getItem('hiddenContentMode') === 'true') {
                d.setAttribute('data-hidden-mode', '1');
            }
        } catch (e) { /* localStorage 不可用时按正常模式渲染 */ }
        try {
            // 动态效果偏好：设置里强制开启 / 关闭时打到 <html> 上，css 与脚本据此放行或停掉动画
            // 地址带 ?motion=on / off / auto 时先按它记下来（排查时一次性强制开启用）
            var motionParam = new URLSearchParams(location.search).get('motion');
            if (motionParam === 'on' || motionParam === 'off') localStorage.setItem('leletv_motion', motionParam);
            else if (motionParam === 'auto') localStorage.removeItem('leletv_motion');
            var motion = localStorage.getItem('leletv_motion');
            if (motion === 'on' || motion === 'off') d.setAttribute('data-motion', motion);
        } catch (e) { /* 忽略 */ }
        try {
            // 首页与导航布局偏好（设置 › 首页与导航）：首帧就按它隐藏聚合动效 / 内容板块、导航只留图标
            // 按数据域取键（同 leletv_theme_normal / leletv_theme_hidden 的惯例）；
            // 私密模式下 hub / shelves 默认关闭，用户在设置里手动打开才会写 true
            var hiddenLayout = d.hasAttribute('data-hidden-mode');
            var layout = JSON.parse(localStorage.getItem(hiddenLayout ? 'leletv_layout_hidden' : 'leletv_layout') || '{}') || {};
            if (layout.hub === false || (hiddenLayout && layout.hub !== true)) d.setAttribute('data-home-hub', 'off');
            if (layout.shelves === false || (hiddenLayout && layout.shelves !== true)) d.setAttribute('data-home-shelves', 'off');
            if (layout.navIcons === true) d.setAttribute('data-nav', 'icons');
        } catch (e) { /* 忽略 */ }

        try {
            // 按数据域取已保存的主题（两个模式各存一套；没存过就保持 css 默认色）
            var raw = localStorage.getItem(d.hasAttribute('data-hidden-mode') ? 'leletv_theme_hidden' : 'leletv_theme_normal');
            if (!raw) return;
            var m = /^#?([0-9a-f]{6})$/i.exec(String((JSON.parse(raw) || {}).hex || ''));
            if (!m) return;
            var hx = m[1];
            var R = parseInt(hx.slice(0, 2), 16) / 255;
            var G = parseInt(hx.slice(2, 4), 16) / 255;
            var B = parseInt(hx.slice(4, 6), 16) / 255;
            var mx = Math.max(R, G, B), mn = Math.min(R, G, B), L = (mx + mn) / 2, D = mx - mn;
            var H = 0, S = 0;
            if (D > 1e-6) {
                S = L > 0.5 ? D / (2 - mx - mn) : D / (mx + mn);
                H = mx === R ? 60 * (((G - B) / D) % 6) : (mx === G ? 60 * ((B - R) / D + 2) : 60 * ((R - G) / D + 4));
                if (H < 0) H += 360;
            }
            S *= 100;
            var STOPS = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900];
            var LS = [96, 93, 87, 80, 70, 60, 51, 43, 35, 26];
            // 无彩色（灰色系）另铺满黑→白，与 js/ui/theme-system.js 的 RAMP_L_MONO 一致
            if (S < 5) LS = [100, 89, 78, 67, 56, 44, 33, 22, 11, 0];
            // 只调明度、保留色相与饱和度：无彩色主色自然得到灰阶
            function shade(l) {
                var c = (1 - Math.abs(2 * l / 100 - 1)) * (S / 100);
                var x = c * (1 - Math.abs(((H / 60) % 2) - 1));
                var mm = l / 100 - c / 2, r = 0, g = 0, b = 0;
                if (H < 60) { r = c; g = x; } else if (H < 120) { r = x; g = c; }
                else if (H < 180) { g = c; b = x; } else if (H < 240) { g = x; b = c; }
                else if (H < 300) { r = x; b = c; } else { r = c; b = x; }
                function f(v) { return ('0' + Math.round((v + mm) * 255).toString(16)).slice(-2); }
                return {
                    hex: '#' + f(r) + f(g) + f(b),
                    rgb: [Math.round((r + mm) * 255), Math.round((g + mm) * 255), Math.round((b + mm) * 255)]
                };
            }
            var st = d.style;
            st.setProperty('--color-primary', '#' + hx);
            st.setProperty('--color-primary-rgb', Math.round(R * 255) + ', ' + Math.round(G * 255) + ', ' + Math.round(B * 255));
            var c3 = shade(80), c4 = shade(70), c6 = shade(51);
            st.setProperty('--color-primary-300', c3.hex);
            st.setProperty('--color-primary-400', c4.hex);
            st.setProperty('--color-primary-400-rgb', c4.rgb.join(', '));
            st.setProperty('--color-primary-600', c6.hex);
            st.setProperty('--color-primary-600-rgb', c6.rgb.join(', '));
            for (var i = 0; i < STOPS.length; i++) {
                st.setProperty('--tw-pink-' + STOPS[i] + '-rgb', shade(LS[i]).rgb.join(' '));
            }
            // 配色派生的其余变量（辅助色、字标色、logo 底色、按钮文字色）由 theme-system.js 算好存在存档里，
            // 这里按名单回放；名单与 theme-system.js 的 EXTRA_VARS 一致
            var vars = (JSON.parse(raw) || {}).vars;
            var ALLOW = ['--v2-blush', '--v2-word', '--v2-aux', '--v2-aux-rgb', '--v2-glow-2', '--v2-tile', '--v2-on-accent', '--v2-bg'];
            if (vars && typeof vars === 'object') {
                for (var j = 0; j < ALLOW.length; j++) {
                    var val = vars[ALLOW[j]];
                    if (typeof val === 'string' && val.length < 64 && /^[#\w(),.\s%-]+$/.test(val)) st.setProperty(ALLOW[j], val);
                }
            }
        } catch (e) { /* 读取失败时回落到 css 默认主题色 */ }
    })();
</script>
<!-- 首帧直达：根据 URL hash 预置初始页面，避免从播放页返回时先渲染首页再切换造成闪动 -->
    <script>
        (function () {
            var n = (location.hash || '').replace('#', '');
            // 私密模式下分类页整体隐藏：hash 直达分类页时首帧就不预置，直接落首页，避免闪动
            try {
                if (n === 'category' && localStorage.getItem('hiddenContentMode') === 'true') {
                    n = 'home';
                    history.replaceState(null, '', (location.pathname || '/') + (location.search || ''));
                }
            } catch (e) { /* localStorage 不可用：按正常模式预置 */ }
            if (n && n !== 'home') {
                document.documentElement.setAttribute('data-init-page', n);
            }
        })();
    </script>

    <!-- 桌面端图标声明 -->
    <link rel="icon" href="/image/brand/leletv-icon-192.png?v=le6" sizes="192x192">
    <link rel="icon" href="/image/brand/leletv-icon-512.png?v=le6" sizes="512x512">

    <!-- marked.js 已移出首屏关键路径：它是 README 弹窗专用的 35KB，且作为 head 里的 defer 脚本
         会排在 dist bundle 之前执行，把 DOMContentLoaded 一起拖晚（启动占位的退场要等它之后的首页就绪）。
         现在由 js/app/app-routing.js 的 ensureMarked() 在第一次进入 README 页时按需加载 -->

    <!-- 首屏启动占位：从主屏/桌面图标冷启动时，HTML 一到达即显示。
         首帧就是最终背景（深色底 + 霓虹粉/樱花白径向光晕），不依赖外部 CSS；
         随后由 body 首部的内联脚本播放「玻璃五角星 → LeLeTV 逐字母显影」入场。 -->
    <style>
        /* 底色兜底：样式表（tokens.css 的 --v2-bg）还在路上时，html/body 的默认背景是白色，
           解析过程中的任何一次重绘都会露出白。先写死深色底，让第一次绘制就是启动层的基底 */
        html, body { background: #0A0A0B; }
        /* 占位期间页面尚未样式化，先按住滚动，避免出现临时滚动条；元素移除后规则自动失效 */
        html:has(#bootSplash) { overflow: hidden; }

        /* 启动层：首帧即最终背景。粉光与樱花白光都是模糊径向渐变，
           与主页 .v2-glow 的三团光同源，只是颜色更集中、更接近镜头光 */
        #bootSplash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            overflow: hidden;
            background:
                radial-gradient(75% 58% at 18% 10%, rgba(var(--v2-aux-rgb, 255, 228, 241), 0.16), transparent 64%),
                radial-gradient(80% 70% at 84% 84%, rgba(var(--v2-accent-rgb, 236, 72, 153), 0.22), transparent 68%),
                var(--v2-bg, #0A0A0B);
            opacity: 1;
            visibility: visible;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            transition: opacity 0.5s ease 0.1s, visibility 0.5s;
        }
        #bootSplash.boot-splash--done {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        /* 鉴权阶段：登录框要盖在启动层（z-index 9999）之上，用户才能直接输入邀请码 */
        #inviteLoginModal.is-boot {
            z-index: 10000;
        }
        /* 退场时先用应用真实背景色铺满启动层，再让字标与遮罩一起离开；
           避免“启动页淡出 → 黑底一帧 → 首页”的跳变 */
        #bootSplash::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            background: var(--v2-bg, #0A0A0B);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.55s ease;
        }
        #bootSplash.is-land::after { opacity: 1; }

        /* 背景光晕：缓慢漂移的粉/樱花白光团，只做氛围，不抢字标 */
        .boot-aurora {
            position: absolute;
            inset: -20%;
            z-index: 0;
            pointer-events: none;
            filter: blur(46px);
            opacity: 0.9;
        }
        .boot-aurora i {
            position: absolute;
            display: block;
            border-radius: 9999px;
            will-change: transform;
        }
        .boot-aurora .a {
            top: 4%;
            left: 6%;
            width: 46vmax;
            height: 46vmax;
            background: radial-gradient(circle, rgba(var(--v2-aux-rgb, 255, 228, 241), 0.24), transparent 66%);
            animation: bootAuroraA 16s ease-in-out infinite alternate;
        }
        .boot-aurora .b {
            right: 0;
            bottom: 2%;
            width: 56vmax;
            height: 56vmax;
            background: radial-gradient(circle, rgba(var(--v2-accent-rgb, 236, 72, 153), 0.26), transparent 66%);
            animation: bootAuroraB 19s ease-in-out infinite alternate;
        }
        .boot-aurora .c {
            top: 34%;
            left: 56%;
            width: 34vmax;
            height: 34vmax;
            background: radial-gradient(circle, rgba(var(--v2-blush, #FFE4F1), 0.12), transparent 68%);
            animation: bootAuroraC 23s ease-in-out infinite alternate;
        }
        @keyframes bootAuroraA {
            from { transform: translate(-4%, -3%) scale(1); }
            to   { transform: translate(6%, 4%) scale(1.14); }
        }
        @keyframes bootAuroraB {
            from { transform: translate(3%, 4%) scale(1.08); }
            to   { transform: translate(-6%, -4%) scale(1); }
        }
        @keyframes bootAuroraC {
            from { transform: translate(-5%, 3%) scale(1); }
            to   { transform: translate(4%, -5%) scale(1.2); }
        }

        /* 舞台：SVG viewBox 0 0 1036.5 520，字标位于 (140,158)，宽 756.5、高 204.5。
           星星与字标共用一个坐标系，撞击点可以精确落在每个字母中心 */
        .boot-stage {
            position: relative;
            z-index: 2;
            display: block;
            width: min(92vw, 760px);
            height: auto;
            margin-top: -3vh;
            overflow: visible;
            filter: drop-shadow(0 22px 70px rgba(var(--v2-accent-rgb, 236, 72, 153), 0.18));
        }

        /* 字标：初始隐藏，由脚本接管显影；脚本没跑起来时 3.2s 后完整显示兜底 */
        .boot-word-group {
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
            transition: transform 0.42s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.42s ease;
            animation: bootWordFallback 0.45s ease 3.2s both;
        }
        #bootSplash.is-intro .boot-word-group {
            animation: none;
            opacity: 1;
        }
        @keyframes bootWordFallback {
            to { opacity: 1; }
        }

        /* 玻璃五角星：半透明白→樱花白→霓虹粉，边缘一圈细高光 */
        .boot-star {
            opacity: 0;
            filter: drop-shadow(0 0 12px rgba(255, 228, 241, 0.7));
            will-change: transform, opacity;
        }
        .boot-star .star-body {
            fill: url(#bootStarFill);
            stroke: rgba(255, 255, 255, 0.85);
            stroke-width: 1.2;
            stroke-linejoin: round;
        }
        .boot-star .star-glint {
            fill: rgba(255, 255, 255, 0.92);
        }
        .boot-star .star-trail {
            fill: none;
            stroke: url(#bootTrailFill);
            stroke-width: 5;
            stroke-linecap: round;
            opacity: 0.6;
        }
        .boot-spark {
            fill: #FFE4F1;
            pointer-events: none;
        }
        .boot-flash {
            fill: url(#bootFlashFill);
            opacity: 0;
            pointer-events: none;
        }

        /* 加载提示：字标下方一条细进度线 + 一行小字 */
        .boot-loading {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: min(70vw, 300px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease 0.2s;
        }
        .boot-loading.is-visible { opacity: 1; }
        .boot-loading-track {
            width: 100%;
            height: 1px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
        }
        .boot-loading-bar {
            display: block;
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, var(--v2-blush, #FFE4F1), var(--color-primary, #EC4899));
            box-shadow: 0 0 8px rgba(var(--v2-accent-rgb, 236, 72, 153), 0.8);
            transition: width 0.18s linear;
        }
        .boot-loading-text {
            font-size: 12px;
            line-height: 1;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.55);
        }

        /* 加载完成：字标轻微放大并淡出，闪光由脚本驱动，随后背景色铺满 */
        #bootSplash.is-burst .boot-word-group {
            transform: scale(1.06);
            opacity: 0;
        }
        #bootSplash.is-burst .boot-loading {
            opacity: 0;
            transition: opacity 0.2s;
        }
        #bootSplash.is-burst .boot-star,
        #bootSplash.is-burst .boot-spark {
            opacity: 0 !important;
        }

        /* 慢速提示：加载超出预期仍未就绪时出现，给用户主动放行的出口 */
        .boot-splash-hint {
            display: none;
            position: absolute;
            left: 50%;
            bottom: 7%;
            z-index: 4;
            transform: translateX(-50%);
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 0 24px;
            text-align: center;
        }
        .boot-splash-hint.is-visible { display: flex; }
        .boot-splash-hint-text {
            font-size: 13px;
            letter-spacing: 0.02em;
            color: rgba(255, 255, 255, 0.56);
        }
        .boot-splash-hint-btn {
            padding: 8px 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 10px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .boot-splash-hint-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.6);
        }

        /* 减弱动效：不飞星、不漂移，直接显示字标并淡出 */
        @media (prefers-reduced-motion: reduce) {
            .boot-aurora i { animation: none; }
            .boot-star { display: none; }
            .boot-loading { transition-duration: 0.2s; }
        }
    </style>
</head>

        // 进度只由启动编排的「鉴权 → 首页 → 进入」阶段决定（见 boot-sequence.js）。

        // ---------- 进度条 ----------
        var shown = 0;
        var lastText = '';
        function renderProgress() {
            var target = clamp01(Math.max(progress, stall));
            shown += (target - shown) * 0.12;
            if (Math.abs(target - shown) < 0.002) shown = target;
            if (loadingBar) loadingBar.style.width = (shown * 100).toFixed(1) + '%';
            var text = stageText || (shown < 0.2 ? '正在准备…'
                : shown < 0.36 ? '正在验证身份…'
                : shown < 0.92 ? '正在加载首页…'
                : '即将进入…');
            if (text !== lastText && loadingText) {
                loadingText.textContent = text;
                lastText = text;
            }
        }

        // ---------- 六星入场 → 逐字母显影 ----------
        // 字标在 SVG 中的位置：x 140..896.5，y 158..362.5；字母中心 y=260。
        // 每颗星的终点就是对应字母中心，显影矩形从中心向两侧展开。
        var FLIGHT_MS = 560;
        var REVEAL_MS = 320;
        var LETTERS = [
            { start: 140, end: 240, cx: 190,   delay: 0,    fx: 1000, fy: 26,  ctrlX: 760, ctrlY: 30 },
            { start: 240, end: 376, cx: 299,   delay: 220,  fx: 1012, fy: 64,  ctrlX: 800, ctrlY: 44 },
            { start: 376, end: 472, cx: 424,   delay: 440,  fx: 1024, fy: 102, ctrlX: 850, ctrlY: 80 },
            { start: 472, end: 605, cx: 522,   delay: 660,  fx: 1036, fy: 140, ctrlX: 900, ctrlY: 116 },
            { start: 605, end: 768, cx: 686.5, delay: 880,  fx: 1048, fy: 178, ctrlX: 950, ctrlY: 154 },
            { start: 768, end: 896.5, cx: 832, delay: 1100, fx: 1060, fy: 216, ctrlX: 1000, ctrlY: 194 }
        ];
        var TOTAL_MS = 1100 + FLIGHT_MS + REVEAL_MS;   // ≈ 1980ms，完整约 2 秒

        var stars = [];
        var starRotates = [];
        var revealRects = [];
        for (var li = 0; li < LETTERS.length; li++) {
            stars.push(document.getElementById('bootStar' + li));
            starRotates.push(document.querySelector('#bootStar' + li + ' .star-rotate'));
            revealRects.push(document.getElementById('bootReveal' + li));
            LETTERS[li].hit = false;
        }

        var introHeld = false;
        var appReady = false;
        var authReady = false;    // 鉴权通过（启动编排通知）
        var homeReady = false;    // 首页数据就绪（启动编排通知）
        var waitingAuth = false;  // 正停在登录门禁：资源 load 不得把进度推走
        var released = false;
        var forced = false;
        var startTime = 0;
        var lastT = 0;
        var flashes = [];
        var sparks = [];

        function quad(ax, ay, bx, by, cx, cy, t) {
            var mt = 1 - t;
            return {
                x: mt * mt * ax + 2 * mt * t * bx + t * t * cx,
                y: mt * mt * ay + 2 * mt * t * by + t * t * cy
            };
        }

        function addFlash(x, y, maxR, life) {
            var el = svgEl('circle');
            el.setAttribute('class', 'boot-flash');
            el.setAttribute('cx', x);
            el.setAttribute('cy', y);
            el.setAttribute('r', '0');
            flashesLayer.appendChild(el);
            flashes.push({ el: el, age: 0, life: life || 420, maxR: maxR || 150 });
        }

        function addSparks(x, y) {
            for (var i = 0; i < 12; i++) {
                var a = Math.random() * Math.PI * 2;
                var speed = 0.08 + Math.random() * 0.22;
                var el = svgEl('circle');
                el.setAttribute('class', 'boot-spark');
                el.setAttribute('cx', x);
                el.setAttribute('cy', y);
                el.setAttribute('r', (1 + Math.random() * 2.4).toFixed(1));
                sparksLayer.appendChild(el);
                sparks.push({
                    el: el,
                    x: x,
                    y: y,
                    vx: Math.cos(a) * speed,
                    vy: Math.sin(a) * speed - 0.08,
                    age: 0,
                    life: 380 + Math.random() * 320
                });
            }
        }

        function updateEffects(dt) {
            for (var i = flashes.length - 1; i >= 0; i--) {
                var f = flashes[i];
                f.age += dt;
                var k = Math.min(1, f.age / f.life);
                f.el.setAttribute('r', (f.maxR * k).toFixed(1));
                f.el.setAttribute('opacity', (0.9 * (1 - k)).toFixed(3));
                if (k >= 1) {
                    if (f.el.parentNode) f.el.parentNode.removeChild(f.el);
                    flashes.splice(i, 1);
                }
            }
            for (var j = sparks.length - 1; j >= 0; j--) {
                var s = sparks[j];
                s.age += dt;
                s.x += s.vx * dt;
                s.y += s.vy * dt;
                s.vy += 0.0005 * dt;
                s.el.setAttribute('cx', s.x.toFixed(1));
                s.el.setAttribute('cy', s.y.toFixed(1));
                var k2 = Math.min(1, s.age / s.life);
                s.el.setAttribute('opacity', (1 - k2).toFixed(3));
                if (k2 >= 1) {
                    if (s.el.parentNode) s.el.parentNode.removeChild(s.el);
                    sparks.splice(j, 1);
                }
            }
        }

        function updateIntro(t, dt) {
            for (var i = 0; i < LETTERS.length; i++) {
                var letter = LETTERS[i];
                var star = stars[i];
                var rect = revealRects[i];
                var local = t - letter.delay;

                if (local < 0) {
                    if (star) star.style.opacity = '0';
                    continue;
                }

                if (local < FLIGHT_MS) {
                    var u = local / FLIGHT_MS;
                    var e = u * u * (3 - 2 * u);
                    var p = quad(letter.fx, letter.fy, letter.ctrlX, letter.ctrlY, letter.cx, 260, e);
                    var rot = -40 + u * 680;
                    var scale = 0.35 + 0.75 * Math.min(1, u * 1.6);
                    if (star) {
                        star.setAttribute('transform', 'translate(' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ')');
                        if (starRotates[i]) {
                            starRotates[i].setAttribute('transform', 'rotate(' + rot.toFixed(1) + ') scale(' + scale.toFixed(2) + ')');
                        }
                        star.style.opacity = String(Math.min(1, local / 90) * Math.min(1, (FLIGHT_MS - local) / 80 + 0.2));
                    }
                } else {
                    if (!letter.hit) {
                        letter.hit = true;
                        if (star) star.style.opacity = '0';
                        addFlash(letter.cx, 260, 150, 420);
                        addSparks(letter.cx, 260);
                    }
                    var r = local - FLIGHT_MS;
                    var k = Math.min(1, r / REVEAL_MS);
                    var eased = 1 - Math.pow(1 - k, 3);
                    if (rect) {
                        // 从撞击点向两侧展开，最终精确覆盖 start..end；
                        // 区间首尾相接，相邻字母的连笔不会被留缝
                        var left = letter.cx + (letter.start - letter.cx) * eased;
                        var right = letter.cx + (letter.end - letter.cx) * eased;
                        rect.setAttribute('x', left.toFixed(1));
                        rect.setAttribute('width', (right - left).toFixed(1));
                    }
                }
            }
            updateEffects(dt);

            if (!introHeld && t >= TOTAL_MS) {
                introHeld = true;
                checkArrive();
            }
        }

        function completeReveal() {
            for (var i = 0; i < LETTERS.length; i++) {
                var letter = LETTERS[i];
                if (stars[i]) stars[i].style.opacity = '0';
                if (revealRects[i]) {
                    revealRects[i].setAttribute('x', letter.start);
                    revealRects[i].setAttribute('width', letter.end - letter.start);
                }
            }
            introHeld = true;
        }

        // ---------- 退场闸门 ----------
        // 退场前确认邀请码门禁：未通过时弹窗必须先可见可交互，否则遮罩一撤就是"能看不能点"
        function ensureGate() {
            try {
                var auth = window.INVITE_AUTH;
                if (!auth || typeof auth.isVerified !== 'function') return;
                if (auth.isVerified()) return;
                var modal = document.getElementById('inviteLoginModal');
                if (modal && getComputedStyle(modal).display === 'none') {
                    modal.style.display = 'flex';
                }
            } catch (e) { /* 忽略：宁可正常退场，也不要卡死 */ }
        }

        function burstFlash() {
            var el = svgEl('circle');
            el.setAttribute('cx', '518');
            el.setAttribute('cy', '260');
            el.setAttribute('fill', 'url(#bootFlashFill)');
            el.setAttribute('opacity', '0.9');
            el.setAttribute('r', '0');
            flashesLayer.appendChild(el);
            var t0 = now();
            (function step(nowTs) {
                var k = Math.min(1, (nowTs - t0) / 520);
                el.setAttribute('r', (420 * k).toFixed(1));
                el.setAttribute('opacity', (0.9 * (1 - k)).toFixed(3));
                if (k < 1) requestAnimationFrame(step);
                else if (el.parentNode) el.parentNode.removeChild(el);
            })(t0);
        }

        function burstAndLeave() {
            if (released) return;
            released = true;
            ensureGate();
            if (loadingEl) loadingEl.classList.remove('is-visible');
            burstFlash();
            splash.classList.add('is-burst');
            setTimeout(function () { splash.classList.add('is-land'); }, 160);
            setTimeout(function () { splash.classList.add('boot-splash--done'); }, 420);
            setTimeout(function () {
                if (splash.parentNode) splash.parentNode.removeChild(splash);
                // 启动屏完全退场、首页已可见：这时才开始后台预加载其他页面
                if (window.LeLeBoot && typeof window.LeLeBoot.onEntered === 'function') {
                    window.LeLeBoot.onEntered();
                }
            }, 1000);
        }

        // 三闸门：入场动画完整落地 + 交互就绪 + 鉴权通过 + 首页就绪；谁慢等谁
        function checkArrive() {
            if (released) return;
            if (!introHeld) return;
            if (!forced && !(appReady && authReady && homeReady)) return;
            burstAndLeave();
        }

        function markAppReady() {
            if (appReady || released) return;
            appReady = true;
            // 交互就绪只说明页面点得动；进度仍由鉴权 / 首页阶段推进
            mark(0.2);
            checkArrive();
        }
        // 业务侧（js/app/app.js）在 setupEventListeners 之后调用此函数
        window.__LELETV_BOOT_READY__ = markAppReady;
        // 通知首页跳过 playHomeIntro：本启动屏已接管入场视觉，不要播第二遍
        window.__LELETV_BOOT_INTRO__ = true;

        // ---------- 启动编排接口 ----------
        // 顺序由 js/app/boot-sequence.js 驱动：先鉴权，鉴权通过才 loadHome，
        // 首页就绪后再 homeReady()，三个信号齐了 checkArrive() 才撤启动屏。
        window.__LELETV_BOOT_UI__ = {
            setStage: setStage,
            // 等待登录：进度停在当前阶段，不再自动缓推
            waitAuth: function () {
                waitingAuth = true;
                stallPaused = true;
                if (loadingEl) loadingEl.classList.add('is-visible');
            },
            // 登录成功、开始加载首页：恢复缓推
            resumeProgress: function () {
                waitingAuth = false;
                stallPaused = false;
                lastProgressAt = now();
            },
            authReady: function () {
                if (authReady) return;
                authReady = true;
                waitingAuth = false;
                stallPaused = false;
                lastProgressAt = now();
                mark(0.35);
                checkArrive();
            },
            homeReady: function () {
                if (homeReady) return;
                homeReady = true;
                mark(1);
                checkArrive();
            },
            isReleased: function () { return released; }
        };

        function skipIntro() {
            if (released) return;
            completeReveal();
            checkArrive();
        }
        function forceArrive() {
            if (released) return;
            forced = true;
            appReady = true;
            authReady = true;
            homeReady = true;
            waitingAuth = false;
            stageText = '即将进入…';
            completeReveal();
            mark(1);
            checkArrive();
        }

        // 点击 / 按键 / 缩放可跳过飞星；慢速提示里的“直接进入”才会强制撤掉遮罩
        window.addEventListener('pointerdown', skipIntro, { passive: true });
        window.addEventListener('keydown', skipIntro);
        if (hintBtn) hintBtn.addEventListener('click', forceArrive);

        var hintShown = false;
        function showHint() {
            if (hintShown || released) return;
            hintShown = true;
            if (hintEl) hintEl.classList.add('is-visible');
        }
        setTimeout(showHint, SLOW_HINT_MS);
        setTimeout(function () { forceArrive(); }, HARD_MAX_MS);

        // ---------- 启动 ----------
        splash.classList.add('is-intro');
        if (reducedMotion()) {
            // 减少动效：不飞星，字标直接完整显示，只保留进度与退场
            completeReveal();
            if (loadingEl) loadingEl.classList.add('is-visible');
        } else {
            if (revealGroup) revealGroup.setAttribute('clip-path', 'url(#bootWordReveal)');
            setTimeout(function () {
                if (!released && loadingEl) loadingEl.classList.add('is-visible');
            }, 300);
        }

        // 动画时长兜底：后台标签页会暂停 rAF，不能让「入场完成」这一信号一直等不到
        setTimeout(function () {
            if (!introHeld && !released) {
                completeReveal();
                checkArrive();
            }
        }, TOTAL_MS + 80);

        // ---------- 主循环：动画 + 进度 + 停滞兜底 ----------
        function tick(nowTs) {
            if (released) return;
            if (!startTime) startTime = nowTs;
            var t = nowTs - startTime;
            var dt = Math.min(40, Math.max(0, nowTs - lastT));
            lastT = nowTs;

            if (!stallPaused && nowTs - lastProgressAt > STALL_AFTER_MS) {
                // 从当前阶段接着往前缓推：否则进度条会在「加载首页」这一段长时间停住
                if (stall < progress) stall = progress;
                stall = clamp01(stall + (dt / 1000) * STALL_RATE);
            }
            renderProgress();
            if (!reducedMotion() && !introHeld) updateIntro(t, dt);
            else updateEffects(dt);

            requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    })();
    </script>

        (function () {

            var link = document.createElement('link');

<!-- 启动占位的退场由 body 首部的粒子引擎统一负责（等首页初始化完成后实体化并爆开），
     此处不再重复接管；旧版"关键样式就绪即淡出"的独立退场逻辑已随之移除。 -->
<script>
    (function () {
        // 兜底：万一粒子引擎没跑起来（脚本被拦截/异常），至少保证占位不会永久挡住页面。
        // 注意这里的判据是"引擎脚本是否执行过"（__LELETV_BOOT_READY__ 由引擎在最外层同步赋值），
        // 不能用 __LELETV_BOOT_INTRO__——它只在跑粒子的分支里设置，减弱动效的用户会误触发本兜底
        setTimeout(function () {
            var splash = document.getElementById('bootSplash');
            if (!splash || splash.classList.contains('boot-splash--done')) return;
            if (typeof window.__LELETV_BOOT_READY__ === 'function') return; // 引擎已接管，交给它按动画节奏退场
            splash.classList.add('boot-splash--done');
            setTimeout(function () {
                if (splash.parentNode) splash.parentNode.removeChild(splash);
            }, 400);
        }, 9000);
    })();
</script>
